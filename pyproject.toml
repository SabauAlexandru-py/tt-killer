[project]
name = "adspower-mcp"
version = "0.1.0"
description = "MCP server that creates and warms TikTok accounts through AdsPower profiles with rotational proxy support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexandru Sabau", email = "alexmoto1102@gmail.com" }]

dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "playwright>=1.42",
    "python-dotenv>=1.0",
    "tiktok-captcha-solver>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
adspower-mcp = "adspower_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adspower_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
